name: Sync from Figma

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes
  workflow_dispatch:          # "Run workflow" button for an instant update

permissions:
  contents: write

concurrency:
  group: sync-figma
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save sharp@0.33.5
      - name: Pull changes from Figma
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        run: node scripts/sync-figma.mjs
      - name: Publish (Vercel redeploys automatically)
        run: |
          if [ -n "$(git status --porcelain index.html work img figma-sync.json)" ]; then
            git config user.name "figma-sync[bot]"
            git config user.email "figma-sync@users.noreply.github.com"
            git add index.html work img figma-sync.json
            git commit -m "Sync from Figma: $(cat .sync-summary 2>/dev/null || echo 'baseline')"
            git push
          else
            echo "Nothing changed in Figma"
          fi
